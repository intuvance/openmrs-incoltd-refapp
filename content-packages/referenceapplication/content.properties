# content.properties

# The name of this content package
#
# NOTE: this MUST differ from the official "referenceapplication" content package.
# The Initializer identifies content packages by name and the OpenMRS SDK installs
# each package into openmrs_config/<domain>/<namespace>/. Sharing a name with the
# official package would make the two collide. The Intuvance site configuration is a
# layer ON TOP of the official package, never a replacement for it.
name=${project.artifactId}

# The version of this content package (must follow SemVer)
version=${project.version}

# Build-time install ordering.
#
# Declaring the official core content package as a dependency forces the OpenMRS SDK
# (ContentHelper#getContentPackagesInInstallationOrder) to install it BEFORE this
# package. This is the upstream-supported mechanism for the layering described in the
# distribution architecture; it requires no changes to OpenMRS core or the Initializer.
content.referenceapplication=1.4.0

# Variable overrides, consumed via ${...} in the configuration files of this package.
# Values can be overridden from distro.properties using `var.<name>=<value>`.
var.default.login.location=6a679877-1472-4c0e-bdd1-e716f88cbfdb
