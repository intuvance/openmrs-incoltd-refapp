user  nobody;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
  worker_connections  1024;
}


http {
  # Maximum request body the gateway will buffer. Unset here means nginx falls
  # back to its built-in 1m, which is what makes large uploads -- patient
  # attachments, complex obs imports, FHIR bundles -- fail with
  # 413 Request Entity Too Large before the request ever reaches the backend.
  # This is only half of the limit; Tomcat's connector has its own (see the
  # server.xml patch in the backend Dockerfile) and the smaller of the two wins.
  #
  # Substituted from OMRS_MAX_UPLOAD_SIZE by the entrypoint (envsubst limited to
  # this variable, because the rest of this file is full of nginx runtime
  # variables that must survive untouched).
  client_max_body_size ${OMRS_MAX_UPLOAD_SIZE};
  # Buffer the body to disk instead of memory past this size, so a single large
  # upload cannot be held in a worker process' memory.
  client_body_buffer_size 1m;

  map $http_user_agent $loggable {
    default 1;
    "~Blackbox-Exporter" 0;
  }
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main if=$loggable;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  keepalive_timeout  65;

  include /etc/nginx/conf.d/*.conf;
}
