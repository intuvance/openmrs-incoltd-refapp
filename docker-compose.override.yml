# Local development override: build the stack images from this repository
# instead of pulling them.
#
#   docker compose build
#   docker compose up -d
#
# The base docker-compose.yml names each image by an OMRS_*_IMAGE variable in
# .env. This override adds the build contexts and nothing else: the name an image
# is built under comes from .env, so there is exactly one place to change it and no
# second copy to drift.
#
# .env points these at intuvance/openmrs-<component>:<OMRS_DISTRO_VERSION>. An
# earlier version of this file named the images here instead, and the images were
# therefore built under the upstream-looking openmrs/openmrs-reference-application-3-*
# names and then given a second, readable tag by deployment/tag-images.sh. That
# left two tags per image pointing at one image id, so `docker images` listed
# everything twice, and the duplicate had to be kept in step forever. Building
# under the final name removes the need for the second tag entirely.

services:
  gateway:
    build:
      context: ./gateway

  frontend:
    build:
      # Repository root, not ./frontend. The frontend image must ship the SITE's
      # SPA config (the queue concept UUIDs, logo and brand colours), which lives
      # in the content package rather than in frontend/. A ./frontend context
      # cannot reach it, so the image would fall back to shipping a demo
      # placeholder and the branding would silently not apply. frontend/
      # Dockerfile copies it to the path the SPA is served from.
      context: .
      dockerfile: frontend/Dockerfile

  backend:
    build:
      context: .

  # The pre-populated database seed, built from deployment/db/ rather than pulled,
  # so that a deployment seeded from this checkout runs against the terminology in
  # this checkout. deployment/db/Dockerfile needs seed.sql, which is a database
  # dump and is deliberately gitignored, so this builds only on a machine that
  # has one; see deployment/db/README.md.
  #
  # Only db-init carries the build section. db-verify consumes the same image by
  # name and has nothing to build, and `docker compose build` covers db-init.
  db-init:
    build:
      context: ./deployment/db
      dockerfile: Dockerfile
