# ---------------------------------------------------------------------------
# Validate the site configuration content package.
#
# Runs on every change to the package. This is a fast gate that exists so that
# metadata defects are caught here rather than surfacing as an OpenMRS startup
# failure hours later, or -- worse -- as a concept that silently duplicates a CIEL
# concept and is never picked up by O3.
# ---------------------------------------------------------------------------
name: Validate site configuration

on:
  push:
    branches: [main, master]
    paths:
      - 'content-packages/**'
      - 'distro/**'
      - 'deployment/db/seed.sh'
      - 'tests/acceptance/validate-content-metadata.py'
      - 'tests/acceptance/test-seed-integrity-gate.sh'
  pull_request:
    paths:
      - 'content-packages/**'
      - 'distro/**'
      - 'deployment/db/seed.sh'
      - 'tests/acceptance/validate-content-metadata.py'
      - 'tests/acceptance/test-seed-integrity-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    name: Validate content metadata and build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate content metadata
        run: |
          # Warnings do not fail the build: the clinical vocabulary is the site's
          # decision. Malformed or duplicate UUIDs do, because the Initializer
          # either aborts on them or creates unusable metadata.
          python3 tests/acceptance/validate-content-metadata.py

      - name: Validate the content package structure
        run: mvn -B -q -Pdistro -pl content-packages,content-packages/referenceapplication install

      - name: Confirm the package is wired into the distribution
        run: |
          # The site package is only useful if the distro actually references it.
          # A package that builds but is not declared in distro.properties is
          # silently ignored by OpenMRS, which is exactly the failure this
          # distribution had before it was wired in.
          for props in distro/distro.properties distro/distro-no-demo.properties; do
            echo "== ${props}"
            grep -q '^content.siteconfiguration=' "${props}" \
              || { echo "::error::${props} does not reference the site content package"; exit 1; }
            grep -q '^content.referenceapplication=' "${props}" \
              || { echo "::error::${props} no longer references the official core content package"; exit 1; }
            # The official core package must never be removed or replaced.
            grep -q '^content.siteconfiguration.artifactId=' "${props}" \
              || { echo "::error::${props} does not pin the site package artifactId"; exit 1; }
            if grep -qE '^content\.siteconfiguration\.artifactId=referenceapplication$' "${props}"; then
              echo "::error::the site package shares the official package's artifactId and would collide"
              exit 1
            fi
            # The demo package must be absent from the production distro.
            if [ "${props}" = "distro/distro-no-demo.properties" ]; then
              if grep -q 'referenceapplication-demo' "${props}"; then
                echo "::error::the demo content package is referenced by ${props}"
                exit 1
              fi
              echo "demo package correctly excluded"
            fi
          done

      - name: Confirm the patched Initializer is the one that will be bundled
        run: |
          # This is the single most damaging thing that can regress silently here.
          #
          # The OpenMRS SDK resolves each `omod.<id>` key using the coordinate
          # `omod.<id>.groupId` when present, and falls back to groupId
          # org.openmrs.module when it is not. So deleting one groupId line from a
          # distro properties file does not fail the build and does not warn: the
          # SDK quietly resolves the upstream Initializer again, and the next boot
          # deletes every concept reference mapping in the seeded database.
          # Nothing above WARN is logged, the healthcheck passes, and drug orders,
          # lab orders, medication workflows and FHIR concept translation stop
          # resolving.
          #
          # The pom and the properties files are checked together because either
          # one alone is not sufficient: the dependency in the pom is what makes
          # the artifact resolvable, and the properties entry is what tells the
          # SDK which coordinate to fetch into openmrs_modules.
          for props in distro/distro.properties distro/distro-no-demo.properties; do
            echo "== ${props}"
            grep -q '^omod\.initializer\.groupId=\${initializer\.groupId}$' "${props}" \
              || { echo "::error::${props} does not set omod.initializer.groupId, so the SDK will resolve org.openmrs.module:initializer-omod and restore the destructive upstream behaviour"; exit 1; }
          done

          grep -q '<initializer\.groupId>io\.github\.intuvance</initializer\.groupId>' distro/pom.xml \
            || { echo "::error::distro/pom.xml no longer pins the Initializer to the Intuvance fork"; exit 1; }
          grep -q '<initializer\.version>2\.12\.1-intuvance\.2</initializer\.version>' distro/pom.xml \
            || { echo "::error::distro/pom.xml pins an Initializer version that is not 2.12.1-intuvance.2. That release declares the wrong <package> in its omod, so every module depending on org.openmrs.module.initializer -- patientdocuments -- refuses to start. See deployment/db/README.md."; exit 1; }
          grep -q 'groupId="io.github.intuvance" artifactId="initializer-omod"' distro/version-rules.xml \
            || { echo "::error::the Initializer is not pinned in distro/version-rules.xml, so versions:update-properties can move the distro back to a destructive upstream release"; exit 1; }

          echo "Initializer pinned to io.github.intuvance:initializer-omod 2.12.1-intuvance.2"

      - name: Test the db-init terminology gate
        run: tests/acceptance/test-seed-integrity-gate.sh
