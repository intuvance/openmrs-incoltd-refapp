# --- Local / site configuration layer ---------------------------------------
# Applied ON TOP OF the official reference application content package above.
# The official package is never removed, emptied or replaced.
#
# The demo content package (openmrs-content-referenceapplication-demo) is
# deliberately absent from this file: it is the only source of sample patients,
# encounters, visits, providers, facilities and demo drugs, and it must never be
# used to seed a production instance.
#
# The `content.*.groupId/artifactId/namespace` overrides are required because this
# package is built from content-packages/referenceapplication in this repository
# under its own groupId. The namespace becomes openmrs_config/<domain>/<namespace>/
# and must differ from the official package namespace so the two coexist.
content.siteconfiguration=${site-content.version}
content.siteconfiguration.groupId=${site-content.groupId}
content.siteconfiguration.artifactId=${site-content.artifactId}
content.siteconfiguration.namespace=${site-content.namespace}

# Site content package variables, overridable without rebuilding the package.
var.default.login.location=${site-login-location}
